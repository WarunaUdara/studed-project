name: StudEd Security Scan Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1" # Weekly Monday scan
  workflow_dispatch:

jobs:
  gitleaks-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  govulncheck-scan:
    name: Go Vulnerability Scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck across services
        run: |
          for svc in services/*; do
            if [ -f "$svc/go.mod" ]; then
              echo "Scanning $svc..."
              (cd "$svc" && govulncheck -mode=source ./...) || exit 1
            fi
          done

  bun-audit-scan:
    name: Bun Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run Bun Untrusted Scan & Audit
        run: |
          cd frontend
          bun pm untrusted
          npm i --package-lock-only
          npm audit --audit-level=high

  kubeconform-scan:
    name: Kubernetes Manifest Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/
      - name: Validate Kubernetes Manifests
        run: |
          kubeconform -kubernetes-version 1.30.0 -schema-location default infra/k8s/services/ infra/k8s/production/services/

  kyverno-policy-check:
    name: Kyverno Admission Security Policy Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kyverno/action-install-cli@v0.2.0
      - name: Validate Manifests against Kyverno Security Policies
        run: |
          kyverno apply infra/k8s/kyverno/cluster-policies.yaml --resource infra/k8s/services/ --resource infra/k8s/production/services/
