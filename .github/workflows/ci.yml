name: StudEd CI Pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  detect-container-changes:
    name: Detect container changes
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.result.outputs.should-build }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect container-relevant changes
        if: github.event_name != 'workflow_dispatch' && github.ref_type != 'tag'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            containers:
              - 'services/**'
              - 'shared/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
      - name: Select container build jobs
        id: result
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.ref_type }}" == "tag" || "${{ steps.filter.outputs.containers }}" == "true" ]]; then
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          fi

  frontend-ci:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: cd frontend && bun install --frozen-lockfile || bun install
      - name: Run Typecheck
        run: cd frontend && bun run typecheck
      - name: Build Production Bundle
        run: cd frontend && bun run build

  go-ci:
    name: Go Microservices & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: "**/go.sum"
      - name: Install Protoc
        run: sudo apt-get install -y protobuf-compiler
      - name: Run Shared Package Tests
        run: make shared-test
      - name: Run Microservices Tests
        run: make go-test

  opentofu-ci:
    name: OpenTofu IaC Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.0
      - name: OpenTofu Init
        run: cd infra/terraform && tofu init -backend=false
      - name: OpenTofu Validate
        run: cd infra/terraform && tofu validate

  k8s-helm-ci:
    name: Kubernetes Manifests & Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"
      - name: Helm Chart Lint
        run: helm lint infra/helm/studed
      - name: Helm Offline Render Validation
        run: helm template studed-ci-release infra/helm/studed > /dev/null

  publish-service-images:
    name: Publish ${{ matrix.service }}
    needs: [detect-container-changes, go-ci]
    if: needs.detect-container-changes.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - ai-service
          - api-gateway
          - auth-service
          - course-service
          - gamification-service
          - notification-service
          - payment-service
          - progress-service
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/studed-${{ matrix.service }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
