---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data
  namespace: studed-preprod
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: studed-preprod
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd-image-updater.argoproj.io/ai.allow-tags: regexp:^sha-
    argocd-image-updater.argoproj.io/ai.ignore-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/ai.update-strategy: latest
    argocd-image-updater.argoproj.io/image-list: ai=ghcr.io/warunaudara/studed-ai-service
  labels:
    app: ai-service
  name: ai-service
  namespace: studed-preprod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      automountServiceAccountToken: false
      containers:
      - envFrom:
        - configMapRef:
            name: studed-config
        - secretRef:
            name: studed-secrets
        image: ghcr.io/warunaudara/studed-ai-service:sha-9f9ecc4
        imagePullPolicy: Always
        lifecycle:
          preStop:
            exec:
              command:
              - sleep
              - "10"
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 15
          periodSeconds: 10
        name: ai-service
        ports:
        - containerPort: 8090
        readinessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 150m
            memory: 96Mi
          requests:
            cpu: 15m
            memory: 30Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /health
            port: 8090
          periodSeconds: 2
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 45
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd-image-updater.argoproj.io/gateway.allow-tags: regexp:^sha-
    argocd-image-updater.argoproj.io/gateway.ignore-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/gateway.update-strategy: latest
    argocd-image-updater.argoproj.io/image-list: gateway=ghcr.io/warunaudara/studed-api-gateway
  labels:
    app: api-gateway
  name: api-gateway
  namespace: studed-preprod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: GOMEMLIMIT
          value: 110MiB
        envFrom:
        - configMapRef:
            name: studed-config
        - secretRef:
            name: studed-secrets
        image: ghcr.io/warunaudara/studed-api-gateway:sha-9f9ecc4
        imagePullPolicy: Always
        lifecycle:
          preStop:
            exec:
              command:
              - sleep
              - "10"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        name: api-gateway
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 40Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 2
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: api-gateway-sa
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: api-gateway
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
---
