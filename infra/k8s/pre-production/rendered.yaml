apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: studed
    app.kubernetes.io/part-of: studed-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
  name: studed-preprod
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway-sa
  namespace: studed-preprod
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    iam.gke.io/gcp-service-account: studed-upload@studed-prod.iam.gserviceaccount.com
  name: upload-service-sa
  namespace: studed-preprod
---
apiVersion: v1
data:
  AI_SERVICE_URL: http://ai-service:8090
  API_GATEWAY_ADDR: :8080
  AUTH_SERVICE_ADDR: auth-service:8081
  COURSE_SERVICE_ADDR: course-service:8083
  ELASTICSEARCH_URL: http://elasticsearch:9200
  GAMIFICATION_SERVICE_ADDR: gamification-service:8088
  GEMINI_MODEL: gemini-2.5-flash
  GRAPHQL_PLAYGROUND: "false"
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 168h
  NOTIFICATION_SERVICE_ADDR: :8092
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
  PAYMENT_SERVICE_URL: http://payment-service:8091
  PROGRESS_SERVICE_ADDR: progress-service:8086
  REDIS_ADDR: redis:6379
  UPLOAD_MAX_BYTES: "10485760"
  UPLOAD_SERVICE_ADDR: :8093
  UPLOAD_SERVICE_URL: http://upload-service:8093
kind: ConfigMap
metadata:
  name: studed-config
  namespace: studed-preprod
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: studed-preprod
spec:
  ports:
  - name: http
    port: 8090
    targetPort: 8090
  selector:
    app: ai-service
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    cloud.google.com/backend-config: '{"default": "studed-backend-config"}'
  name: api-gateway
  namespace: studed-preprod
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: api-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: studed-preprod
spec:
  ports:
  - name: grpc
    port: 8081
    targetPort: 8081
  - name: http
    port: 8085
    targetPort: 8085
  selector:
    app: auth-service
---
apiVersion: v1
kind: Service
metadata:
  name: course-service
  namespace: studed-preprod
spec:
  ports:
  - name: grpc
    port: 8083
    targetPort: 8083
  - name: http
    port: 8084
    targetPort: 8084
  selector:
    app: course-service
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: studed-preprod
spec:
  ports:
  - port: 9200
    targetPort: 9200
  selector:
    app: elasticsearch
---
apiVersion: v1
kind: Service
metadata:
  name: gamification-service
  namespace: studed-preprod
spec:
  ports:
  - name: grpc
    port: 8088
    targetPort: 8088
  - name: http
    port: 8089
    targetPort: 8089
  selector:
    app: gamification-service
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: studed-preprod
spec:
  ports:
  - name: http
