apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: redis
  name: redis
  namespace: studed-preprod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - args:
        - --appendonly
        - "yes"
        - --maxmemory
        - 96mb
        - --maxmemory-policy
        - allkeys-lru
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          failureThreshold: 3
          initialDelaySeconds: 15
          periodSeconds: 10
        name: redis
        ports:
        - containerPort: 6379
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /data
          name: redis-data
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd-image-updater.argoproj.io/image-list: upload=ghcr.io/warunaudara/studed-upload-service
    argocd-image-updater.argoproj.io/upload.allow-tags: regexp:^sha-
    argocd-image-updater.argoproj.io/upload.ignore-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/upload.update-strategy: latest
  labels:
    app: upload-service
  name: upload-service
  namespace: studed-preprod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upload-service
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: upload-service
    spec:
      automountServiceAccountToken: true
      containers:
      - env:
        - name: GOMEMLIMIT
          value: 220MiB
        envFrom:
        - configMapRef:
            name: studed-config
        - secretRef:
            name: studed-secrets
        image: ghcr.io/warunaudara/studed-upload-service:sha-9f9ecc4
        imagePullPolicy: Always
        lifecycle:
          preStop:
            exec:
              command:
              - sleep
              - "10"
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8093
          initialDelaySeconds: 15
          periodSeconds: 10
        name: upload-service
        ports:
        - containerPort: 8093
        readinessProbe:
          httpGet:
            path: /ready
            port: 8093
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 300m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 48Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /health
            port: 8093
          periodSeconds: 2
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: upload-service-sa
      terminationGracePeriodSeconds: 45
      volumes:
      - emptyDir:
          sizeLimit: 512Mi
        name: tmp
