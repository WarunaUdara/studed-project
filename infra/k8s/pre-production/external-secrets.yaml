# Pre-prod pulls the SAME Secret Manager keys as production, except
# DATABASE_URL points at the isolated studed_preprod database on Neon so
# feature testing cannot pollute production data. The external-secrets
# controller (namespace external-secrets) already has project-level
# secretmanager.secretAccessor, so no extra IAM is needed for these keys.

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-store
spec:
  provider:
    gcpsm:
      projectID: studed-prod
      auth:
        workloadIdentity:
          clusterLocation: asia-south1-a
          clusterName: studed-prod
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: studed-secrets
  namespace: studed
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: studed-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: studed-preprod-database-url
        version: latest
    - secretKey: JWT_ACCESS_SECRET
      remoteRef:
        key: studed-jwt-access-secret
        version: latest
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: studed-jwt-refresh-secret
        version: latest
    - secretKey: SERVICE_TOKEN
      remoteRef:
        key: studed-service-token
        version: latest
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: studed-gemini-api-key
        version: latest
    - secretKey: OPENCODE_API_KEY
      remoteRef:
        key: studed-opencode-api-key
        version: latest
    - secretKey: PAYHERE_MERCHANT_ID
      remoteRef:
        key: studed-payhere-merchant-id
        version: latest
    - secretKey: PAYHERE_MERCHANT_SECRET
      remoteRef:
        key: studed-payhere-merchant-secret
        version: latest
    - secretKey: PAYHERE_NOTIFY_URL
      remoteRef:
        key: studed-payhere-notify-url
        version: latest
    - secretKey: GCS_BUCKET_NAME
      remoteRef:
        key: studed-gcs-bucket-name
        version: latest