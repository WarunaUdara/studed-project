apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data
  namespace: studed
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: studed
  labels:
    app: elasticsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: elasticsearch
          image: elasticsearch:8.14.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            # Deliberately NOT read-only: Elasticsearch 8 regenerates
            # elasticsearch.keystore under config/ and writes logs/ and tmp/ on
            # every boot. Locking the root filesystem here fails startup, so the
            # kyverno require-read-only-root-filesystem policy excludes this pod.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          resources:
            requests:
              memory: "768Mi"
              cpu: "100m"
            limits:
              memory: "1.5Gi"
              cpu: "1000m"
          readinessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
          # Liveness only checks that the HTTP port answers: a yellow/red
          # cluster should drain from the Service via readiness, not be killed.
          # ES with a 512m heap can take 2-3 min to open :9200, so give the
          # liveness probe a long grace window before it is allowed to kill.
          livenessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 180
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: elasticsearch-data
          persistentVolumeClaim:
            claimName: elasticsearch-data
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: studed
spec:
  ports:
    - port: 9200
      targetPort: 9200
  selector:
    app: elasticsearch
