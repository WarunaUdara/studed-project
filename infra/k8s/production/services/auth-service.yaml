apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: studed
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/warunaudara/studed-auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: studed-config
            - secretRef:
                name: studed-secrets
          resources:
            requests:
              memory: "30Mi"
              cpu: "15m"
            limits:
              memory: "96Mi"
              cpu: "150m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: studed
spec:
  ports:
    - port: 8081
      targetPort: 8081
      name: grpc
    - port: 8085
      targetPort: 8085
      name: http
  selector:
    app: auth-service
