apiVersion: apps/v1
kind: Deployment
metadata:
  name: progress-service
  namespace: studed
  labels:
    app: progress-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: progress-service
  template:
    metadata:
      labels:
        app: progress-service
    spec:
      containers:
        - name: progress-service
          image: ghcr.io/warunaudara/studed-progress-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: studed-config
            - secretRef:
                name: studed-secrets
          resources:
            requests:
              memory: "30Mi"
              cpu: "15m"
            limits:
              memory: "96Mi"
              cpu: "150m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8087
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: progress-service
  namespace: studed
spec:
  ports:
    - port: 8086
      targetPort: 8086
      name: grpc
    - port: 8087
      targetPort: 8087
      name: http
  selector:
    app: progress-service
