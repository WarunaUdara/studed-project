apiVersion: apps/v1
kind: Deployment
metadata:
  name: progress-service
  namespace: studed
  labels:
    app: progress-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: progress-service
  template:
    metadata:
      labels:
        app: progress-service
    spec:
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: progress-service
          image: ghcr.io/warunaudara/studed-progress-service:sha-0c5760a
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8086
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: studed-config
            - secretRef:
                name: studed-secrets
          resources:
            requests:
              memory: "30Mi"
              cpu: "15m"
            limits:
              memory: "96Mi"
              cpu: "150m"
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          startupProbe:
            httpGet:
              path: /health
              port: 8087
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: 8087
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8087
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: progress-service
  namespace: studed
spec:
  ports:
    - port: 8086
      targetPort: 8086
      name: grpc
    - port: 8087
      targetPort: 8087
      name: http
  selector:
    app: progress-service
