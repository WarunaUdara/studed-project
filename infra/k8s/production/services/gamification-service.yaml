apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamification-service
  namespace: studed
  labels:
    app: gamification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gamification-service
  template:
    metadata:
      labels:
        app: gamification-service
    spec:
      containers:
        - name: gamification-service
          image: ghcr.io/warunaudara/studed-gamification-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8088
            - containerPort: 8089
          envFrom:
            - configMapRef:
                name: studed-config
            - secretRef:
                name: studed-secrets
          resources:
            requests:
              memory: "30Mi"
              cpu: "15m"
            limits:
              memory: "96Mi"
              cpu: "150m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8089
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gamification-service
  namespace: studed
spec:
  ports:
    - port: 8088
      targetPort: 8088
      name: grpc
    - port: 8089
      targetPort: 8089
      name: http
  selector:
    app: gamification-service
