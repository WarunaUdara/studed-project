# Public entrypoint for the StudEd API.
# GCE Ingress (managed L7 LB) pinned to the static IP, TLS via GKE managed cert.
# The api-gateway Service carries the BackendConfig annotation to attach
# Cloud Armor (studed2-waf) and tune the LB health check.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studed-ingress
  namespace: studed
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: studed2-ingress-ip
    kubernetes.io/ingress.allow-http: "true"
    kubernetes.io/ingress.redirect-http-to-https: "true"
    networking.gke.io/managed-certificates: studed-api-cert-v2
spec:
  rules:
    - host: api.34.102.169.180.sslip.io
      http:
        paths:
          - path: /.well-known/acme-challenge
            pathType: Prefix
            backend:
              service:
                name: acme-challenge
                port:
                  number: 8080
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
    - host: api-preprod.34.102.169.180.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: preprod-api-gateway
                port:
                  number: 8080

