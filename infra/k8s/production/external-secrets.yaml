# Secrets are pulled from GCP Secret Manager via Workload Identity.
# The external-secrets controller's ServiceAccount is annotated with
# iam.gke.io/gcp-service-account = studed-external-secrets@studed-prod.iam.gserviceaccount.com
# (that GSA has roles/secretmanager.secretAccessor scoped per-secret).

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-store
spec:
  provider:
    gcpsm:
      projectID: studed-prod
      auth:
        workloadIdentity:
          clusterLocation: asia-south1-a
          clusterName: studed-prod
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: studed-secrets
  namespace: studed
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: studed-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: studed-database-url
        version: latest
    - secretKey: JWT_ACCESS_SECRET
      remoteRef:
        key: studed-jwt-access-secret
        version: latest
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: studed-jwt-refresh-secret
        version: latest
    - secretKey: SERVICE_TOKEN
      remoteRef:
        key: studed-service-token
        version: latest
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: studed-gemini-api-key
        version: latest
    - secretKey: OPENCODE_API_KEY
      remoteRef:
        key: studed-opencode-api-key
        version: latest
    - secretKey: PAYHERE_MERCHANT_ID
      remoteRef:
        key: studed-payhere-merchant-id
        version: latest
    - secretKey: PAYHERE_MERCHANT_SECRET
      remoteRef:
        key: studed-payhere-merchant-secret
        version: latest
    - secretKey: PAYHERE_NOTIFY_URL
      remoteRef:
        key: studed-payhere-notify-url
        version: latest
    # Not secret, but populate-secrets.sh derives it as
    # studed-uploads-${PROJECT_ID}. Sourcing it here keeps the project ID out of
    # the ConfigMap, where a stale value would silently send uploads to the
    # wrong bucket (or to the local-disk fallback).
    - secretKey: GCS_BUCKET_NAME
      remoteRef:
        key: studed-gcs-bucket-name
        version: latest
