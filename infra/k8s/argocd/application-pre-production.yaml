apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: studed-pre-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/WarunaUdara/studed-project.git'
    targetRevision: HEAD
    path: infra/k8s/pre-production
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: studed-preprod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true