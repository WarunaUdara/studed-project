# Argo Rollouts BlueGreen example for api-gateway.
#
# This is an OPT-IN progressive-delivery rollout. It is NOT applied by the
# production ArgoCD app (infra/k8s/production) until you promote it there.
# To enable:
#   1. Install controllers:  make gitops-controllers
#   2. Replace the api-gateway Deployment in infra/k8s/production/services
#      with this Rollout (delete the Deployment first - same selector),
#      then commit. ArgoCD self-heals it into place.
#   3. Verify:   argo rollouts status rollout api-gateway -n studed
#   4. Promote:  argo rollouts promote rollout api-gateway -n studed
#   5. Rollback: argo rollouts abort   rollout api-gateway -n studed
#
# BlueGreen needs no service mesh: the green ReplicaSet boots, passes probes,
# then the Rollout flips the active Service selector atomically. Manual gate
# (autoPromotionEnabled: false) means a bad release never reaches users.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-gateway
  namespace: studed
  labels:
    app: api-gateway
  annotations:
    argocd-image-updater.argoproj.io/image-list: gateway=ghcr.io/warunaudara/studed-api-gateway
    argocd-image-updater.argoproj.io/gateway.update-strategy: latest
    argocd-image-updater.argoproj.io/gateway.allow-tags: regexp:^sha-
    argocd-image-updater.argoproj.io/gateway.ignore-tags: regexp:^latest$
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: api-gateway-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: ghcr.io/warunaudara/studed-api-gateway:sha-0c5760a
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          env:
            - name: GOMEMLIMIT
              value: "110MiB"
          envFrom:
            - configMapRef:
                name: studed-config
            - secretRef:
                name: studed-secrets
          resources:
            requests:
              memory: "40Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
  strategy:
    blueGreen:
      activeService: api-gateway
      previewService: api-gateway-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 60
---
# Preview service so the green stack is reachable (e.g. via port-forward) for
# smoke tests BEFORE the active Service selector flips.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-preview
  namespace: studed
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: api-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: studed
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway