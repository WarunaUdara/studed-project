# Local/dev overlay for upload-service (kind, minikube, k8s-dev.sh).
#
# The production manifest lives in infra/k8s/production/services/upload-service.yaml
# and is the one ArgoCD syncs. This one runs against the in-cluster GCS emulator
# instead of real GCS, so it needs no Workload Identity binding.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-service
  namespace: studed
  labels:
    app: upload-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: upload-service
  template:
    metadata:
      labels:
        app: upload-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: upload-service
          image: ghcr.io/warunaudara/studed-upload-service:v1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8093
          env:
            - name: UPLOAD_SERVICE_ADDR
              value: ":8093"
            - name: GCS_BUCKET_NAME
              value: "studed-uploads-local"
            - name: STORAGE_EMULATOR_HOST
              value: "http://gcs-emulator:4443"
          envFrom:
            - configMapRef:
                name: studed-config
                optional: true
            - secretRef:
                name: studed-secrets
                optional: true
          resources:
            requests:
              memory: "48Mi"
              cpu: "15m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /ready
              port: 8093
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8093
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: upload-service
  namespace: studed
spec:
  ports:
    - port: 8093
      targetPort: 8093
      name: http
  selector:
    app: upload-service
