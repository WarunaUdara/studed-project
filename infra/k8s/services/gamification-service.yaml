apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamification-service
  namespace: studed
  labels:
    app: gamification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gamification-service
  template:
    metadata:
      labels:
        app: gamification-service
    spec:
      serviceAccountName: studed-gamification-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: gamification-service
          image: studed-doc-gamification-service:v1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8088
            - containerPort: 8089
          envFrom:
            - configMapRef:
                name: studed-config
            - secretRef:
                name: studed-secrets
          resources:
            requests:
              memory: "15Mi"
              cpu: "10m"
            limits:
              memory: "48Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8089
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8089
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gamification-service
  namespace: studed
spec:
  ports:
    - port: 8088
      targetPort: 8088
      name: grpc
    - port: 8089
      targetPort: 8089
      name: http
  selector:
    app: gamification-service
