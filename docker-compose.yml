services:
  postgres:
    image: postgres:15-alpine
    container_name: studed-postgres
    environment:
      POSTGRES_USER: studed
      POSTGRES_PASSWORD: studed
      POSTGRES_DB: studed
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "studed", "-d", "studed"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: studed-redis
    ports:
      - "6379:6379"

  elasticsearch:
    build:
      context: infra/docker/elasticsearch
    container_name: studed-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: studed-auth-service
    environment:
      AUTH_SERVICE_ADDR: :8081
      DATABASE_URL: postgres://studed:studed@postgres:5432/studed?sslmode=disable
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-bytes-long
      JWT_REFRESH_SECRET: change-me-refresh-secret-min-32-bytes-long
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 168h
    ports:
      - "8081:8081"
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  course-service:
    build:
      context: .
      dockerfile: services/course-service/Dockerfile
    container_name: studed-course-service
    environment:
      COURSE_SERVICE_ADDR: :8083
      DATABASE_URL: postgres://studed:studed@postgres:5432/studed?sslmode=disable
      AUTH_SERVICE_ADDR: auth-service:8081
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "8083:8083"
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  progress-service:
    build:
      context: .
      dockerfile: services/progress-service/Dockerfile
    container_name: studed-progress-service
    environment:
      PROGRESS_SERVICE_ADDR: :8086
      DATABASE_URL: postgres://studed:studed@postgres:5432/studed?sslmode=disable
      COURSE_SERVICE_ADDR: course-service:8083
      GAMIFICATION_SERVICE_ADDR: gamification-service:8088
    ports:
      - "8086:8086"
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      course-service:
        condition: service_healthy
      gamification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  gamification-service:
    build:
      context: .
      dockerfile: services/gamification-service/Dockerfile
    container_name: studed-gamification-service
    environment:
      GAMIFICATION_SERVICE_ADDR: :8088
      DATABASE_URL: postgres://studed:studed@postgres:5432/studed?sslmode=disable
      REDIS_ADDR: redis:6379
    ports:
      - "8088:8088"
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8089/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: studed-ai-service
    environment:
      AI_SERVICE_ADDR: :8090
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: studed-payment-service
    environment:
      PAYMENT_SERVICE_ADDR: :8091
      DATABASE_URL: postgres://studed:studed@postgres:5432/studed?sslmode=disable
      PAYHERE_MERCHANT_ID: ${PAYHERE_MERCHANT_ID:-}
      PAYHERE_MERCHANT_SECRET: ${PAYHERE_MERCHANT_SECRET:-}
      PAYHERE_NOTIFY_URL: ${PAYHERE_NOTIFY_URL:-}
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: studed-notification-service
    environment:
      NOTIFICATION_SERVICE_ADDR: :8092
      DATABASE_URL: postgres://studed:studed@postgres:5432/studed?sslmode=disable
    ports:
      - "8092:8092"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8092/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: studed-api-gateway
    environment:
      API_GATEWAY_ADDR: :8080
      AUTH_SERVICE_ADDR: auth-service:8081
      COURSE_SERVICE_ADDR: course-service:8083
      PROGRESS_SERVICE_ADDR: progress-service:8086
      GAMIFICATION_SERVICE_ADDR: gamification-service:8088
      AI_SERVICE_URL: http://ai-service:8090
      PAYMENT_SERVICE_URL: http://payment-service:8091
      REDIS_ADDR: redis:6379
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-bytes-long
      GRAPHQL_PLAYGROUND: "true"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_started
      auth-service:
        condition: service_healthy
      course-service:
        condition: service_healthy
      progress-service:
        condition: service_healthy
      gamification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studed-frontend
    environment:
      VITE_PROXY_TARGET: http://api-gateway:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      api-gateway:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: studed-prometheus
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/monitoring/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana:11.5.1
    container_name: studed-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: studed-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://studed:studed@postgres:5432/studed?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: studed-redis-exporter
    environment:
      REDIS_ADDR: "redis:6379"
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_started

volumes:
  postgres_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
